<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" font-family="Segoe UI, Arial, sans-serif">
  <rect width="920" height="430" fill="#f4f7fb"/>
  <text x="460" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e3a8a">RAID DE UN VISTAZO — cuantos discos y cuanta proteccion</text>
  <g font-size="13">
    <rect x="60" y="70" width="200" height="26" rx="6" fill="#1e3a8a"/>
    <text x="160" y="87" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">RAID 0 - velocidad</text>
    <rect x="60" y="105" width="90" height="70" fill="#93c5fd" stroke="#1e3a8a" stroke-width="2"/>
    <rect x="160" y="105" width="90" height="70" fill="#93c5fd" stroke="#1e3a8a" stroke-width="2"/>
    <text x="160" y="205" text-anchor="middle" fill="#1e3a8a">2+ discos, datos partidos</text>
    <text x="160" y="222" text-anchor="middle" fill="#b91c1c">Falla 1 disco = se PIERDE todo</text>
    <rect x="290" y="70" width="200" height="26" rx="6" fill="#1e3a8a"/>
    <text x="390" y="87" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">RAID 1 - espejo</text>
    <rect x="290" y="105" width="90" height="70" fill="#6ee7b7" stroke="#1e3a8a" stroke-width="2"/>
    <rect x="390" y="105" width="90" height="70" fill="#6ee7b7" stroke="#1e3a8a" stroke-width="2"/>
    <text x="390" y="205" text-anchor="middle" fill="#1e3a8a">2 discos iguales</text>
    <text x="390" y="222" text-anchor="middle" fill="#047857">Falla 1 = sigues trabajando</text>
    <rect x="520" y="70" width="200" height="26" rx="6" fill="#1e3a8a"/>
    <text x="620" y="87" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">RAID 5 - paridad</text>
    <rect x="520" y="105" width="55" height="70" fill="#fcd34d" stroke="#1e3a8a" stroke-width="2"/>
    <rect x="582" y="105" width="55" height="70" fill="#fcd34d" stroke="#1e3a8a" stroke-width="2"/>
    <rect x="644" y="105" width="55" height="70" fill="#fcd34d" stroke="#1e3a8a" stroke-width="2"/>
    <text x="650" y="205" text-anchor="middle" fill="#1e3a8a">3+ discos, paridad</text>
    <text x="650" y="222" text-anchor="middle" fill="#047857">Falla 1 = sigues trabajando</text>
    <rect x="750" y="70" width="170" height="26" rx="6" fill="#1e3a8a"/>
    <text x="835" y="87" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">RAID 10</text>
    <rect x="750" y="105" width="40" height="70" fill="#c084fc" stroke="#1e3a8a" stroke-width="2"/>
    <rect x="797" y="105" width="40" height="70" fill="#c084fc" stroke="#1e3a8a" stroke-width="2"/>
    <rect x="844" y="105" width="40" height="70" fill="#c084fc" stroke="#1e3a8a" stroke-width="2"/>
    <rect x="891" y="105" width="40" height="70" fill="#c084fc" stroke="#1e3a8a" stroke-width="2"/>
    <text x="835" y="205" text-anchor="middle" fill="#1e3a8a">4+ discos, espejo+partes</text>
    <text x="835" y="222" text-anchor="middle" fill="#047857">Rapido y tolerante (bases de datos)</text>
  </g>
  <rect x="60" y="260" width="860" height="34" rx="6" fill="#b91c1c"/>
  <text x="460" y="282" text-anchor="middle" font-size="14" fill="#fff">IMPORTANTE: RAID NO es respaldo. Ransomware y borrados afectan el RAID igual</text>
  <rect x="60" y="310" width="860" height="34" rx="6" fill="#1e3a8a"/>
  <text x="460" y="332" text-anchor="middle" font-size="14" fill="#fff">Razon de mas: RAID mide redundancia de DISCOS, no versiones de DATOS en el tiempo</text>
  <rect x="60" y="360" width="860" height="34" rx="6" fill="#3b82f6"/>
  <text x="460" y="382" text-anchor="middle" font-size="14" fill="#fff">Decide: archivos criticos → RAID 1 o 5 + backup; solo rendimiento → RAID 0 (y respaldo igual)</text>
</svg>