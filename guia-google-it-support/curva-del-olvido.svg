<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="920" height="340" fill="#f4f7fb"/>
  <text x="460" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e3a8a">LA CURVA DEL OLVIDO (Ebbinghaus, 1885) — y como vencerla</text>
  <path d="M 90 270 L 880 270" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 90 270 L 90 60" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 90 90 Q 300 120 470 170 T 760 252" stroke="#ef4444" stroke-width="4" fill="none"/>
  <text x="545" y="200" font-size="14" fill="#ef4444">sin repaso: muere en 1 semana</text>
  <path d="M 90 90 Q 500 92 880 100" stroke="#10b981" stroke-width="4" fill="none" stroke-dasharray="8 5"/>
  <text x="610" y="80" font-size="14" fill="#10b981">con repeticion espaciada: casi plano</text>
  <g fill="#1e3a8a" font-size="13" text-anchor="middle">
    <rect x="160" y="196" width="150" height="44" rx="7" fill="#dbeafe"/>
    <text x="235" y="215" fill="#0b1f4d">Dia 1: aprendes</text>
    <text x="235" y="231" fill="#0b1f4d">(100%)</text>
    <rect x="360" y="196" width="150" height="44" rx="7" fill="#dbeafe"/>
    <text x="435" y="215" fill="#0b1f4d">Dia 2-3: repaso</text>
    <text x="435" y="231" fill="#0b1f4d">(recuperas ~85%)</text>
    <rect x="555" y="196" width="150" height="44" rx="7" fill="#dbeafe"/>
    <text x="630" y="215" fill="#0b1f4d">Dia 7: repaso</text>
    <text x="630" y="231" fill="#0b1f4d">(sube a ~90%)</text>
    <rect x="745" y="196" width="120" height="44" rx="7" fill="#dbeafe"/>
    <text x="805" y="215" fill="#0b1f4d">Dia 30: casi</text>
    <text x="805" y="231" fill="#0b1f4d">perfecto</text>
  </g>
  <text x="460" y="320" text-anchor="middle" font-size="14" fill="#0b1f4d">Herramienta libre: Anki (flashcards, algoritmo SM-2) — 15 min al dia cambian todo</text>
</svg>