<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" font-family="Segoe UI, Arial, sans-serif">
  <rect width="920" height="330" fill="#f4f7fb"/>
  <text x="460" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e3a8a">EL CICLO DE GESTION DE PARCHES — metodo, no improvisacion</text>
  <g font-size="13">
    <rect x="40" y="80" width="160" height="64" rx="8" fill="#3b82f6"/>
    <text x="120" y="106" text-anchor="middle" font-weight="bold" fill="#fff">1. INVENTARIO</text>
    <text x="120" y="124" text-anchor="middle" fill="#e0edff">que esta instalado</text>
    <path d="M 200 112 L 258 112" stroke="#0ea5e9" stroke-width="3" marker-end="url(#a)"/>
    <rect x="262" y="80" width="160" height="64" rx="8" fill="#2563eb"/>
    <text x="342" y="106" text-anchor="middle" font-weight="bold" fill="#fff">2. PRIORIZAR</text>
    <text x="342" y="124" text-anchor="middle" fill="#dbeafe">critico → bajo</text>
    <path d="M 422 112 L 480 112" stroke="#0ea5e9" stroke-width="3" marker-end="url(#a)"/>
    <rect x="484" y="80" width="160" height="64" rx="8" fill="#f59e0b"/>
    <text x="564" y="106" text-anchor="middle" font-weight="bold" fill="#fff">3. PROBAR</text>
    <text x="564" y="124" text-anchor="middle" fill="#fff8e1">grupo piloto pequeno</text>
    <path d="M 644 112 L 702 112" stroke="#0ea5e9" stroke-width="3" marker-end="url(#a)"/>
    <rect x="706" y="80" width="160" height="64" rx="8" fill="#8b5cf6"/>
    <text x="786" y="106" text-anchor="middle" font-weight="bold" fill="#fff">4. APLICAR</text>
    <text x="786" y="124" text-anchor="middle" fill="#ede9fe">ventana, documentar</text>
    <rect x="262" y="190" width="160" height="64" rx="8" fill="#10b981"/>
    <text x="342" y="216" text-anchor="middle" font-weight="bold" fill="#fff">5. VERIFICAR</text>
    <text x="342" y="234" text-anchor="middle" fill="#d1fae5">y REVERTIR si algo falla</text>
    <path d="M 706 144 L 706 222 L 426 222" stroke="#f59e0b" stroke-width="3" fill="none" marker-end="url(#b)"/>
    <text x="560" y="210" font-size="12" fill="#b45309">ciclo continuo: el inventario cambia</text>
    <text x="560" y="226" font-size="12" fill="#b45309">y vuelve al paso 1</text>
  </g>
  <rect x="40" y="278" width="826" height="34" rx="8" fill="#1e3a8a"/>
  <text x="453" y="300" text-anchor="middle" font-size="13" fill="#fff">Dato de oro: la mayoria de los grandes ataque se aprovechan de vulnerabilidades con parche disponible desde meses antes</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0ea5e9"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/></marker>
  </defs>
</svg>