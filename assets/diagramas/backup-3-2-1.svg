  <text x="460" y="322" text-anchor="middle" font-size="14" fill="#fff">EXTRA 3-2-1-1: haz la copia de la nube INMUTABLE (nadie la borra, ni el atacante)</text>
  <rect x="60" y="350" width="860" height="34" rx="6" fill="#1e3a8a"/>
  <text x="460" y="372" text-anchor="middle" font-size="14" fill="#fff">Regla final: un backup que nunca se resto... no existe. Pruebalo siempre</text>
