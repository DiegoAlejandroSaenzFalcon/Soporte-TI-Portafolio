<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" font-family="Segoe UI, Arial, sans-serif">
  <rect width="920" height="320" fill="#f4f7fb"/>
  <text x="460" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e3a8a">EL TRUCO EN 1 DIBUJO — el celular se vuelve un modem</text>
  <rect x="30" y="100" width="200" height="90" rx="10" fill="#f59e0b"/>
  <text x="130" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">TORRE DE SEÑAL</text>
  <text x="130" y="152" text-anchor="middle" font-size="12" fill="#fff7e6">Los datos del plan</text>
  <text x="130" y="170" text-anchor="middle" font-size="12" fill="#fff7e6">(lo que pagas cada mes)</text>
  <path d="M 230 145 L 300 145" stroke="#0b5394" stroke-width="4" marker-end="url(#a)"/>
  <rect x="304" y="100" width="220" height="90" rx="10" fill="#0b5394"/>
  <text x="414" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">CELULAR ANDROID</text>
  <text x="414" y="148" text-anchor="middle" font-size="12" fill="#dbeafe">Zona Wi-Fi ENCENDIDA</text>
  <text x="414" y="166" text-anchor="middle" font-size="12" fill="#dbeafe">= se vuelve un modem</text>
  <path d="M 524 145 L 594 145" stroke="#f59e0b" stroke-width="4" marker-end="url(#b)"/>
  <rect x="598" y="100" width="290" height="90" rx="10" fill="#10b981"/>
  <text x="743" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">TELEVISOR GOOGLE TV</text>
  <text x="743" y="148" text-anchor="middle" font-size="12" fill="#d1fae5">Busca la red del celular</text>
  <text x="743" y="166" text-anchor="middle" font-size="12" fill="#d1fae5">teclea la contraseña y listo</text>
  <rect x="230" y="236" width="460" height="56" rx="8" fill="#fff7ed"/>
  <text x="460" y="259" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c2d12">IMPORTANTE: ver videos gasta datos del plan</text>
  <text x="460" y="280" text-anchor="middle" font-size="13" fill="#9a3412">Cuando termines de ver, APAGA la Zona Wi-Fi del celular</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0b5394"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/></marker>
  </defs>
</svg>