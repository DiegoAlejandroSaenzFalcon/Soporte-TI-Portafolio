<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" font-family="Segoe UI, Arial, sans-serif">
  <rect width="920" height="320" fill="#f4f7fb"/>
  <text x="460" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e3a8a">LA BIBLIOTECA DE 3 NIVELES — donde vive cada documento</text>
  <rect x="40" y="70" width="840" height="56" rx="8" fill="#1e3a8a"/>
  <text x="460" y="95" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">NIVEL 1 · EL REPOSITORIO = LA BIBLIOTECA</text>
  <text x="460" y="115" text-anchor="middle" font-size="13" fill="#dbeafe">Contiene carpetas y archivos. Este es tu proyecto completo.</text>
  <path d="M 230 126 L 230 150" stroke="#f59e0b" stroke-width="3" marker-end="url(#a)"/>
  <rect x="230" y="154" width="460" height="56" rx="8" fill="#3b82f6"/>
  <text x="460" y="179" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">NIVEL 2 · LA CARPETA (guia-google-it-support) = EL ESTANTE</text>
  <text x="460" y="199" text-anchor="middle" font-size="13" fill="#e0edff">Contiene los cursos. Haz clic en su nombre para entrar.</text>
  <path d="M 230 210 L 230 236" stroke="#f59e0b" stroke-width="3" marker-end="url(#b)"/>
  <rect x="230" y="240" width="460" height="56" rx="8" fill="#10b981"/>
  <text x="460" y="265" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">NIVEL 3 · EL MODULO (0202-modulo-2-...) = EL LIBRO</text>
  <text x="460" y="285" text-anchor="middle" font-size="13" fill="#d1fae5">Se abre renderizado (bonito, con tablas e imagenes).</text>
  <rect x="720" y="190" width="160" height="90" rx="8" fill="#fef3c7"/>
  <text x="800" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">MIGAS DE PAN</text>
  <text x="800" y="238" text-anchor="middle" font-size="12" fill="#78350f">arriba: Repositorio ></text>
  <text x="800" y="254" text-anchor="middle" font-size="12" fill="#78350f">Carpeta > Archivo</text>
  <text x="800" y="270" text-anchor="middle" font-size="12" fill="#78350f">clic para subir nivel</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/></marker>
  </defs>
</svg>